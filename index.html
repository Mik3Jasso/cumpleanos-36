  <meta name="theme-color" content="#c0392f">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 8 8'%3E%3Crect width='8' height='8' fill='%23c0392f'/%3E%3Cpath d='M3 1h2v1h2v1h-1v2h-1v1h1v1h-4v-1h1v-1h-1v-2h-1v-1h2z' fill='%23f5f5f2'/%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Pixelify+Sans:wght@400;600;700&family=Press+Start+2P&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="hud">
    <span class="hud-name">MIGUEL</span>
    <span class="hud-lv">LV.36</span>
    <span class="hud-hp" aria-hidden="true">HP <span id="hud-hearts"></span></span>
    <span class="hud-date" id="hud-date"></span>
  </header>

  <main class="wrap">
   <div class="cols">
    <section class="hero" aria-labelledby="t">
      <div class="window dark ribbon" id="ribbon" hidden></div>
      <div class="window title-card" id="title-card">
        <p class="kicker">PRÓXIMO NIVEL</p>
        <div class="title-row">
          <h1 id="t"><span class="t-small">NIVEL</span><span class="t-big">36</span></h1>
          <div class="cake" id="cake" aria-hidden="true"></div>
        </div>
      </div>

      <div class="window dark dialog" id="dialog">
        <p class="speaker">MIGUEL</p>
        <p class="speech" id="speech"></p>
        <span class="more" aria-hidden="true">▼</span>
      </div>

      <ul class="quick" id="quick"></ul>
      <a class="btn cta" href="#rsvp">▶ CONFIRMAR ASISTENCIA</a>
    </section>

    <div class="stack">
      <section class="window" aria-labelledby="h-quest">
        <h2 id="h-quest" class="w-title">EVENTO</h2>
        <dl class="quest" id="quest"></dl>
        <ul class="menu" id="menu"></ul>
      </section>

      <section class="window" aria-labelledby="h-time">
        <h2 id="h-time" class="w-title">TIEMPO RESTANTE</h2>
        <div class="count" id="count" role="timer" aria-live="off">
          <div><b id="c-d">--</b><small>DÍAS</small></div>
          <div><b id="c-h">--</b><small>HRS</small></div>
          <div><b id="c-m">--</b><small>MIN</small></div>
          <div><b id="c-s">--</b><small>SEG</small></div>
        </div>
        <div class="xp" aria-hidden="true"><span class="xp-bar"><i id="xp-fill"></i></span><span class="xp-txt" id="xp-txt">CARGANDO…</span></div>
      </section>

      <section class="window rsvp" id="rsvp" aria-labelledby="h-rsvp">
        <h2 id="h-rsvp" class="w-title">TU PARTY</h2>
        <div id="rsvp-body" aria-live="polite"></div>
      </section>
    </div>
   </div>

    <footer class="foot">© 2026 · Hecho con pixeles y cariño</footer>
  </main>

  <script src="config.js"></script>
  <script src="app.js"></script>
</body>
</html>
